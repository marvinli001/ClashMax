name: Bug report
description: Report a reproducible ClashMax problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for reproducible bugs. Remove subscription URLs, proxy credentials, private domains, and personal network details before posting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: ClashMax version
      description: Use Settings -> About, the release tag, or the app bundle version.
      placeholder: "1.0.7 (13)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: "macOS 26.x, Apple Silicon / Intel"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard / runtime start-stop
        - Profiles / subscriptions
        - Proxies / delay testing
        - Connections / rules / logs
        - System Proxy
        - TUN helper
        - NE Transparent Proxy Experimental
        - Updates / Sparkle
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install ClashMax.app in /Applications
        2. Import or select a profile
        3. Start runtime in ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic bundle, logs or screenshots
      description: |
        Attach a diagnostic bundle: Help -> Export Diagnostic Bundle... (or the same button on the Status page) saves one text file with versions, runtime state, diagnoses, the effective runtime YAML and recent logs. It removes secrets, subscription URLs, node credentials, Wi-Fi names and your public IP before writing, and shows you the contents first; it keeps node names, server addresses and logged domains, so read it before attaching. Drag the .txt file into this box. Anything you paste by hand must be redacted yourself.

