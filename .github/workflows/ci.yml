name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Xcode the maintainer verifies with locally. The runner image rotates its
  # default Xcode, so pin here and fall back with a warning when the pinned
  # version is no longer installed on the image.
  XCODE_VERSION: "26.5"

  # A formatter is only a gate if CI and every workstation run the same build:
  # a different version reformats different lines and the two disagree about
  # what "formatted" means. This must match the --minversion line in
  # .swiftformat, which the install step asserts. The checksum is for that
  # release's swiftformat_linux.zip, so bump both in the same commit.
  SWIFTFORMAT_VERSION: "0.62.1"
  SWIFTFORMAT_LINUX_SHA256: "61ff55f3581e2144a4ad114831167102c38be853df75c1477d20b40a8e8120aa"

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags and full history: the translation gate labels an offending key as
          # new since the last release tag, which is where untranslated keys come
          # from in practice. The repository is ~8 MiB, so this is cheap.
          fetch-depth: 0

      - name: String catalog is valid JSON
        run: jq empty Resources/Localizable.xcstrings

      # 1.0.22 shipped the whole Quick Rules panel in English on Simplified Chinese
      # systems: archiving re-extracted the catalog, added 49 keys, and nothing was
      # red. LocalizationTests only asserts hand-picked keys, so this is the check
      # that covers keys nobody thought to name.
      - name: New string-catalog keys ship a Chinese translation
        run: script/localization_new_key_gate.sh

      - name: Translation gate fixtures
        run: script/test_localization_new_key_gate.sh

      # The release ships a fully static Linux binary (built against the static
      # Swift SDK), so no Swift toolchain is needed on this runner and the whole
      # step is a download plus a checksum.
      - name: Install SwiftFormat
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^--minversion[[:space:]]\{1,\}//p' .swiftformat | tr -d '[:space:]')"
          if [ "$pinned" != "$SWIFTFORMAT_VERSION" ]; then
            echo "::error file=.swiftformat::.swiftformat pins SwiftFormat $pinned but this workflow installs $SWIFTFORMAT_VERSION; the two must be bumped together."
            exit 1
          fi
          zip="$RUNNER_TEMP/swiftformat_linux.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_LINUX_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat_linux"
          echo "SWIFTFORMAT=$RUNNER_TEMP/swiftformat/swiftformat_linux" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/swiftformat/swiftformat_linux" --version

      # Only the files this change touches. The tree was written for years
      # without a formatter, so a repo-wide gate would be red on arrival; the
      # scoped gate converges the tree as it is edited, and one mechanical
      # commit will format the remainder later. See docs/DEVELOPMENT.md.
      - name: SwiftFormat gate (files this change touches)
        env:
          # Push events: the commit the branch was on before this push. Empty on
          # pull_request, where the script uses the base branch instead.
          SWIFTFORMAT_LINT_BASE: ${{ github.event.before }}
        run: script/swiftformat_lint.sh

      # Never fails. This is the burn-down number for the step-2 commit, printed
      # where it can be watched rather than re-derived by hand.
      - name: SwiftFormat debt in the rest of the tree
        if: always()
        run: script/swiftformat_lint.sh --all --summary || true

      - name: Shell scripts are executable and have a shebang
        run: |
          set -euo pipefail
          failed=0
          for script in script/*.sh; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::script is not executable"
              failed=1
            fi
            if ! head -n 1 "$script" | grep -q '^#!'; then
              echo "::error file=$script::script has no shebang"
              failed=1
            fi
          done
          exit "$failed"

      - name: No private keys committed
        run: |
          set -euo pipefail
          # SECURITY.md asks reporters to keep secrets out of the repository and out of
          # public issues. This is the mechanical half of that promise. The workflow file
          # itself is excluded because it necessarily contains the search pattern.
          # -e is required: the pattern starts with dashes and would otherwise be
          # parsed as an option, which makes the check silently pass.
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -InE -e "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A private key block is committed to the repository."
            exit 1
          fi
          echo "No private key blocks found."

  test:
    name: Tests and localization gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not installed on this runner image; using the image default."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Same command as README.md, CONTRIBUTING.md, and docs/DEVELOPMENT.md, apart from
      # the result bundle, so a red CI run reproduces locally verbatim. A fresh clone has
      # neither the bundled Mihomo binaries nor the workstation-only release runbook, so
      # the tests that need them report as skipped rather than failing.
      - name: Run tests
        run: |
          xcodebuild test \
            -project ClashMax.xcodeproj \
            -scheme ClashMax \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/ClashMaxTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # xcodebuild prints a failing assertion where it happens — thousands of lines above
      # the end of the log — and its trailing "Failing tests:" list carries only test names.
      # The result bundle has the message, but it is a ~100 MB artifact. Repeat the failure
      # text at the end of the log so a red run explains itself at a glance.
      - name: Summarize test failures
        if: failure()
        run: |
          set -uo pipefail
          bundle="DerivedData/ClashMaxTests.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No result bundle at $bundle."
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path "$bundle" --format json \
            | jq -r '.testFailures[]? | "\(.targetName // "?") · \(.testName // "?")\n\(.failureText // "no failure text")\n"' \
            || echo "Could not read failures from $bundle; download the test-results artifact instead."

      # Validates Resources/Localizable.xcstrings, dry-runs catalog compilation, and
      # re-runs LocalizationTests including the active-key stale check. Reuses the
      # DerivedData above, so this is an incremental step rather than a second build.
      - name: Localization gate
        run: script/localization_gate.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: DerivedData/ClashMaxTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Release build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not installed on this runner image; using the image default."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release is the shipping configuration: universal (arm64 + x86_64) and built
      # with optimizations, which the Debug test build does not cover. Signing,
      # notarization, and the release smoke gate stay on the maintainer's machine
      # because they need Developer ID assets that CI does not have.
      - name: Build Release (unsigned)
        run: |
          xcodebuild build \
            -project ClashMax.xcodeproj \
            -scheme ClashMax \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData-Release \
            CODE_SIGNING_ALLOWED=NO

      # The helper, LaunchDaemon plist, Network Extension, and core payload are
      # embedded by build script phases, so a silent regression there would not fail
      # the compile. Assert the shipped bundle layout instead.
      - name: Check app bundle layout
        run: |
          set -euo pipefail
          app="DerivedData-Release/Build/Products/Release/ClashMax.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/ClashMax"
          test -f "$app/Contents/Library/LaunchServices/ClashMaxHelper"
          test -f "$app/Contents/Library/LaunchDaemons/io.github.clashmax.ClashMax.Helper.plist"
          test -d "$app/Contents/Library/SystemExtensions/io.github.clashmax.ClashMax.NetworkExtension.systemextension"
          test -f "$app/Contents/Resources/Core/mihomo-manifest.json"
          # The legacy helper location must stay empty; macOS reads the helper from
          # Contents/Library/LaunchServices.
          test ! -e "$app/Contents/MacOS/ClashMaxHelper"

          archs="$(lipo -archs "$app/Contents/MacOS/ClashMax")"
          echo "app architectures: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::Release app binary is missing the $arch slice"; exit 1 ;;
            esac
          done

      # macOS 26.4 and later tell users an app "includes a component that isn't
      # compatible with future versions of macOS" when any Mach-O in its bundle
      # lacks an arm64 slice — even one that never executes. ClashMax used to embed
      # a separate Intel-only Mihomo core, which is exactly what set it off.
      - name: Check no embedded binary is Intel-only
        run: |
          set -euo pipefail
          app="DerivedData-Release/Build/Products/Release/ClashMax.app"

          # The per-architecture cores are superseded by the merged universal one.
          # CI does not fetch the core, so this only catches a build-phase regression
          # that re-embeds them; the maintainer-side gate is release_smoke_check.sh.
          if compgen -G "$app/Contents/Resources/Core/mihomo-darwin-*" > /dev/null; then
            echo "::error::Per-architecture Mihomo cores are embedded; ship the merged universal Core/mihomo instead"
            exit 1
          fi

          status=0
          while IFS= read -r binary; do
            # lipo fails on anything that is not Mach-O, which is how non-code
            # resources are skipped.
            archs="$(lipo -archs "$binary" 2>/dev/null)" || continue
            case " $archs " in
              *" arm64 "*) printf 'ok    %-14s %s\n' "$archs" "${binary#"$app/"}" ;;
              *)
                echo "::error::${binary#"$app/"} has no arm64 slice ($archs)"
                status=1
                ;;
            esac
          done < <(find "$app" -type f)
          exit $status
